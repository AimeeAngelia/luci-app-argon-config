name: Release

on:
  push:
    tags: ['v*', 'release-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/check.yml
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: argon-config-*
          path: packages
          merge-multiple: true
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          find packages -type f \( -name '*.apk' -o -name '*.ipk' \) > assets.txt
          test -s assets.txt
          mapfile -t assets < assets.txt
          gh release create "$RELEASE_TAG" "${assets[@]}" --draft \
            --title "$RELEASE_TAG" --generate-notes
